name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # v4 는 Node 20 위에서 도는데 러너가 더 이상 지원하지 않아 강제로 24 로
      # 올려 실행된다는 경고가 뜬다. 액션 자체를 올려서 맞춘다.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # electron 을 내려받을 필요는 없다. Jest 는 __mocks__/electron.js 로 돈다.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      # 실패하면 요약만 남고 원인이 로그 안에 묻힌다. 실패한 테스트 이름과 이유를
      # ::error:: 로 다시 내보내 주석(annotation)에 실리게 한다. 주석은 로그와 달리
      # 공개 저장소에서 인증 없이 읽을 수 있어, 원인을 바로 확인할 수 있다.
      - name: Test
        run: |
          set -o pipefail
          if npm test -- --ci --verbose 2>&1 | tee jest.log; then
            exit 0
          fi
          echo "--- 실패 요약 ---"
          grep -nE '●|✕|Tests:|Test Suites:|Cannot find|SyntaxError|TypeError' jest.log \
            | head -40 \
            | while IFS= read -r line; do
                echo "::error::${line}"
              done
          exit 1
